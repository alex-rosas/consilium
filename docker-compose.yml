services:
  # -------------------------------------------------------------------------
  # phoenix — OTel trace storage and UI
  # Profiles:
  #   monitoring  — start Phoenix alone (observability only)
  #   app         — start full stack (includes Phoenix)
  # -------------------------------------------------------------------------
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: consilium-phoenix
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix-data:/data
    networks:
      - consilium-network
    profiles: ["app", "monitoring"]

  # -------------------------------------------------------------------------
  # quaestor — document retrieval service (separate repo: ../quaestor)
  # Requires both repos to be co-located as siblings; see README.
  # -------------------------------------------------------------------------
  quaestor:
    build:
      context: ../quaestor
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    networks:
      - consilium-network
    profiles: ["app"]

  # -------------------------------------------------------------------------
  # consilium — multi-agent compliance API + streaming web UI
  # -------------------------------------------------------------------------
  consilium:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      # LLM — Groq (round-robin across up to 3 keys)
      - LLM_PROVIDER=groq
      - GROQ_API_KEY_1=${GROQ_API_KEY_1}
      - GROQ_API_KEY_2=${GROQ_API_KEY_2:-}
      - GROQ_API_KEY_3=${GROQ_API_KEY_3:-}
      # Retrieval — Quaestor running as a sibling service
      - RETRIEVAL_PROVIDER=quaestor
      - QUAESTOR_BASE_URL=http://quaestor:8000
      # Observability — Phoenix running as a sibling service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:4318
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - quaestor
      - phoenix
    networks:
      - consilium-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles: ["app"]

networks:
  consilium-network:
    driver: bridge

volumes:
  phoenix-data:
    driver: local
