services:
  consilium-api:
    build: .
    ports:
      - "8001:8001"
    environment:
      # LLM — Ollama must be running on the host
      - LLM_PROVIDER=ollama
      # env var defaults allow Linux override: OLLAMA_BASE_URL=http://172.17.0.1:11434 docker-compose up
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      # Retrieval — set to "quaestor" once Quaestor is running
      - RETRIEVAL_PROVIDER=${RETRIEVAL_PROVIDER:-mock}
      # Quaestor runs as an independent service on the host (separate repo)
      - QUAESTOR_BASE_URL=${QUAESTOR_BASE_URL:-http://host.docker.internal:8000}
      # Set to "true" only in development to fall back to mock when Quaestor is down
      - ALLOW_MOCK_FALLBACK=${ALLOW_MOCK_FALLBACK:-false}
      # API
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
      # Linux compatibility: Docker Desktop defines host.docker.internal automatically;
      # on native Linux Docker it does not exist. This entry maps it to the Docker bridge
      # gateway (the host machine), making the config identical across all platforms.
      # On macOS/Windows Docker Desktop this entry is redundant but harmless.
      - "host.docker.internal:host-gateway"
    networks:
      - consilium-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: consilium-phoenix
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix-data:/data
    networks:
      - consilium-network

networks:
  consilium-network:
    driver: bridge

volumes:
  phoenix-data:
    driver: local

# NOTE: Quaestor is NOT included here intentionally.
# Quaestor is an independent service (separate repo, separate compose file).
# To use real retrieval:
#   1. Start Quaestor: cd ../quaestor && docker-compose up
#   2. Set RETRIEVAL_PROVIDER=quaestor above
